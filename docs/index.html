<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Shawn</title>
<meta name="description" content="Learning 11 songs from Shawn Mendes' album Shawn on guitar. Press play to hear each one.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F3EF;
    --ink: #16262C;
    --muted: #5C6A6E;
    --line: #D3D9D4;
    --wash: #E6EBE7;
    --teal: #1F5C73;
    --pick: #E9B824;
    --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1.0625rem/1.55 var(--body);
  }

  .wrap {
    max-width: 44rem;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 4rem;
  }

  h1 {
    font: 700 clamp(2.4rem, 7vw, 3.6rem)/1.02 var(--display);
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
  }

  .intro { max-width: 34rem; margin: 0 0 2rem; }

  /* One dot per song, filled by status */
  .progress { margin: 0 0 2.5rem; }
  .pegs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    list-style: none;
    padding: 0;
    margin: 0 0 0.75rem;
  }
  .peg {
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
  }
  .peg.learning { background: var(--pick); }
  .peg.learned { background: var(--teal); border-color: var(--teal); }
  .progress-text { margin: 0; color: var(--muted); font-size: 0.95rem; }

  /* Track list */
  .tracks {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 2px solid var(--ink);
  }
  .track { border-bottom: 1px solid var(--line); }

  .track summary {
    display: grid;
    grid-template-columns: 2.5rem 1fr auto 1rem;
    gap: 0.25rem 1rem;
    align-items: center;
    padding: 1rem 0.25rem;
    cursor: pointer;
    list-style: none;
  }
  .track summary::-webkit-details-marker { display: none; }
  .track summary:hover { background: var(--wash); }
  .track summary:focus-visible { outline: 3px solid var(--teal); outline-offset: -3px; }

  .num {
    font: 600 1.5rem/1 var(--display);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .title { font: 600 1.25rem/1.2 var(--display); }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0 0.9rem;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .dot {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    border: 2px solid var(--ink);
  }
  .status.learning .dot { background: var(--pick); }
  .status.learned .dot { background: var(--teal); border-color: var(--teal); }

  .chev {
    width: 0.6rem;
    height: 0.6rem;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 0.15s;
  }
  .track[open] .chev { transform: rotate(-135deg); }

  /* Recordings */
  .clips, .empty { padding: 0 0.25rem 1.25rem 3.5rem; margin: 0; }
  .clips { list-style: none; }
  .empty { color: var(--muted); }
  .clip { margin: 0 0 1.1rem; }
  .clip:last-child { margin-bottom: 0; }
  .clip-head { display: flex; flex-wrap: wrap; gap: 0.1rem 0.75rem; margin-bottom: 0.35rem; }
  .clip-date { font-weight: 700; }
  .clip-note { color: var(--muted); }
  audio { display: block; width: 100%; }

  footer { margin-top: 2rem; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 34rem) {
    .track summary { grid-template-columns: 2rem 1fr 1rem; }
    .status { grid-column: 2; grid-row: 2; }
    .chev { grid-column: 3; grid-row: 1; }
    .clips, .empty { padding-left: 0.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chev { transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Learning Shawn</h1>
  <p class="intro">
    I'm teaching myself guitar by learning 11 songs from Shawn Mendes' 2024 album <i>Shawn</i>.
    Open a song and press play to hear where it's at.
  </p>

  <div class="progress">
    <ul class="pegs" id="pegs" aria-hidden="true"></ul>
    <p class="progress-text" id="progress-text"></p>
  </div>

  <ol class="tracks" id="tracks"></ol>

  <footer>Recordings are phone voice memos, played as recorded.</footer>
  <noscript><p>This page needs JavaScript to show the song list.</p></noscript>
</main>

<script>
/* ============================================================
   EDIT THIS LIST. It is the only part of the site you change.

   status: "not-started", "learning", or "learned"

   To add a recording:
     1. Put the audio file in the audio/ folder.
     2. Add a line like this inside that song's clips list:
        { file: "audio/2026-09-29-why-why-why.m4a", date: "2026-09-29", note: "First run-through" },
   ============================================================ */
const SONGS = [
  { track: 1,  title: "Who I Am",            seconds: 100, bpm: 87,  status: "not-started", clips: [
  ] },
  { track: 2,  title: "Why Why Why",         seconds: 169, bpm: 105, status: "not-started", clips: [
  ] },
  { track: 3,  title: "That's the Dream",    seconds: 134, bpm: 96,  status: "not-started", clips: [
  ] },
  { track: 4,  title: "Nobody Knows",        seconds: 152, bpm: 81,  status: "not-started", clips: [
  ] },
  { track: 5,  title: "Isn't That Enough",   seconds: 165, bpm: 120, status: "not-started", clips: [
  ] },
  { track: 6,  title: "Heart of Gold",       seconds: 172, bpm: 135, status: "not-started", clips: [
  ] },
  { track: 7,  title: "Heavy",               seconds: 154, bpm: 136, status: "not-started", clips: [
  ] },
  { track: 8,  title: "That'll Be the Day",  seconds: 112, bpm: 129, status: "not-started", clips: [
  ] },
  { track: 9,  title: "In Between",          seconds: 117, bpm: 151, status: "not-started", clips: [
  ] },
  { track: 10, title: "The Mountain",        seconds: 176, bpm: 92,  status: "not-started", clips: [
  ] },
  { track: 11, title: "Rollin' Right Along", seconds: 159, bpm: 94,  status: "not-started", clips: [
  ] }
];
/* ============================================================ */

const STATUS_LABEL = {
  "not-started": "Not started",
  "learning": "Learning",
  "learned": "Learned"
};

function esc(text) {
  return String(text).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function mmss(total) {
  const m = Math.floor(total / 60);
  const s = String(total % 60).padStart(2, "0");
  return m + ":" + s;
}

function prettyDate(iso) {
  const d = new Date(iso + "T12:00:00Z");
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}

function renderClips(song) {
  if (!song.clips.length) {
    return '<p class="empty">No recordings yet.</p>';
  }
  const items = song.clips.map(function (c) {
    return '<li class="clip">' +
      '<div class="clip-head">' +
        '<span class="clip-date">' + prettyDate(c.date) + '</span>' +
        (c.note ? '<span class="clip-note">' + esc(c.note) + '</span>' : '') +
      '</div>' +
      '<audio controls preload="none" src="' + esc(c.file) + '"></audio>' +
    '</li>';
  }).join("");
  return '<ul class="clips">' + items + '</ul>';
}

function renderTrack(song) {
  const count = song.clips.length;
  const countText = count ? '<span>' + count + (count === 1 ? ' recording' : ' recordings') + '</span>' : '';
  return '<li><details class="track">' +
    '<summary>' +
      '<span class="num">' + song.track + '</span>' +
      '<span>' +
        '<span class="title">' + esc(song.title) + '</span>' +
        '<span class="meta"><span>' + mmss(song.seconds) + '</span><span>' + song.bpm + ' BPM</span>' + countText + '</span>' +
      '</span>' +
      '<span class="status ' + song.status + '"><span class="dot"></span>' + STATUS_LABEL[song.status] + '</span>' +
      '<span class="chev" aria-hidden="true"></span>' +
    '</summary>' +
    renderClips(song) +
  '</details></li>';
}

function renderProgress() {
  document.getElementById("pegs").innerHTML = SONGS.map(function (s) {
    return '<li class="peg ' + s.status + '"></li>';
  }).join("");

  const learned = SONGS.filter(function (s) { return s.status === "learned"; }).length;
  const learning = SONGS.filter(function (s) { return s.status === "learning"; }).length;
  const notStarted = SONGS.length - learned - learning;
  document.getElementById("progress-text").textContent =
    learned + " learned, " + learning + " in progress, " + notStarted + " not started";
}

document.getElementById("tracks").innerHTML = SONGS.map(renderTrack).join("");
renderProgress();

// Only one recording plays at a time.
document.addEventListener("play", function (e) {
  if (e.target.tagName !== "AUDIO") return;
  document.querySelectorAll("audio").forEach(function (a) {
    if (a !== e.target) a.pause();
  });
}, true);
</script>
</body>
</html>
